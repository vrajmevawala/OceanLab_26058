services:
  - type: web
    name: codesage-api
    env: node
    rootDir: .
    buildCommand: pnpm install && pnpm build
    startCommand: cd apps/api && pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

  - type: web
    name: codesage-web
    env: node
    rootDir: .
    buildCommand: pnpm install && pnpm build
    startCommand: cd apps/web && pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: codesage-api
          envVarKey: RENDER_EXTERNAL_URL

  - type: worker
    name: codesage-worker
    env: node
    rootDir: .
    buildCommand: pnpm install && pnpm build
    startCommand: cd apps/worker && pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
